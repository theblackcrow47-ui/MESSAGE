
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفلاح</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* الغيوم المتحركة */
.cloud {
    position: absolute;
    width: 190px;
    height: 120px;
    animation: float 12s ease-in-out infinite alternate;
    pointer-events: none;
}

.cloud svg {
    width: 100%;
    height: 100%;
}

.cloud path {
    fill: #850b0b;
    stroke: white;
    stroke-width: 4;
}

.cloud1 {
    top: 5%;
    left: -35px;
}

.cloud2 {
    top: 30%;
    right: -65px;
    animation-delay: 2s;
}

.cloud3 {
    bottom: 12%;
    left: -40px;
    animation-delay: 4s;
}

.cloud4 {
    bottom: 2%;
    right: -70px;
    animation-delay: 1s;
}

@keyframes float {
    from {
        transform: translateY(-15px) rotate(-4deg);
    }
    to {
        transform: translateY(20px) rotate(4deg);
    }
}

/* محتوى الصفحة */
.container {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 380px;
    text-align: center;
}

/* الغيمة الثابتة */
.logo-cloud {
    width: 260px;
    height: 165px;
    position: relative;
    margin: 0 auto 25px;
}

.logo-cloud svg {
    width: 100%;
    height: 100%;
}

.logo-cloud path {
    fill: #850b0b;
    stroke: white;
    stroke-width: 3;
}

.logo-text {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 29px;
    font-weight: bold;
    color: white;
    text-shadow: 0 2px 5px #300000;
}

/* خانة الرمز */
.password-box {
    width: 100%;
    padding: 15px;
    background: #151515;
    border: 1px solid #8b1111;
    border-radius: 8px;
    color: white;
    text-align: center;
    font-size: 20px;
    outline: none;
    letter-spacing: 8px;
    transition: 0.3s;
}

.password-box:focus {
    border-color: #e00000;
    box-shadow: 0 0 15px #8b111155;
}

.password-box::placeholder {
    color: #777;
    letter-spacing: 1px;
    font-size: 14px;
}

.enter-btn {
    margin-top: 18px;
    width: 100%;
    padding: 13px;
    background: #850b0b;
    color: white;
    border: 1px solid white;
    border-radius: 7px;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

.enter-btn:hover {
    background: #b00000;
    box-shadow: 0 0 18px #a00000;
}

#error {
    color: #ff4545;
    margin-top: 15px;
    font-size: 14px;
    display: none;
}

#success {
    display: none;
    font-size: 23px;
    color: #fff;
    margin-top: 25px;
}

@media(max-width: 480px) {
    .cloud {
        width: 150px;
        height: 100px;
    }

    .logo-cloud {
        width: 230px;
        height: 145px;
    }
}
</style>
</head>

<body>

<!-- الغيوم المتحركة -->
<div class="cloud cloud1">
<svg viewBox="0 0 200 120">
<path d="M10 65 C-5 40 20 15 55 20 C65 -5 115 -5 125 25 C175 25 195 55 180 85 C170 115 125 115 105 95 C80 125 30 110 30 85 C15 85 5 80 10 65Z"/>
</svg>
</div>

<div class="cloud cloud2">
<svg viewBox="0 0 200 120">
<path d="M10 65 C-5 40 20 15 55 20 C65 -5 115 -5 125 25 C175 25 195 55 180 85 C170 115 125 115 105 95 C80 125 30 110 30 85 C15 85 5 80 10 65Z"/>
</svg>
</div>

<div class="cloud cloud3">
<svg viewBox="0 0 200 120">
<path d="M10 65 C-5 40 20 15 55 20 C65 -5 115 -5 125 25 C175 25 195 55 180 85 C170 115 125 115 105 95 C80 125 30 110 30 85 C15 85 5 80 10 65Z"/>
</svg>
</div>

<div class="cloud cloud4">
<svg viewBox="0 0 200 120">
<path d="M10 65 C-5 40 20 15 55 20 C65 -5 115 -5 125 25 C175 25 195 55 180 85 C170 115 125 115 105 95 C80 125 30 110 30 85 C15 85 5 80 10 65Z"/>
</svg>
</div>

<!-- الصفحة الرئيسية -->
<div class="container" id="login">

    <!-- الغيمة الثابتة -->
    <div class="logo-cloud">
        <svg viewBox="0 0 200 120">
            <path d="M10 65 C-5 40 20 15 55 20 C65 -5 115 -5 125 25 C175 25 195 55 180 85 C170 115 125 115 105 95 C80 125 30 110 30 85 C15 85 5 80 10 65Z"/>
        </svg>

        <div class="logo-text">
            الفلاح
        </div>
    </div>

    <!-- إدخال رمز الدخول -->
    <input
        type="password"
        id="password"
        class="password-box"
        placeholder="أدخل رمز الدخول"
        autocomplete="off"
    >

    <button class="enter-btn" onclick="checkPassword()">
        دخول
    </button>

    <p id="error">الرمز غير صحيح.. حاول مرة أخرى</p>

</div>

<!-- نجاح الدخول -->
<div id="success">
    تم الدخول بنجاح ❤️
</div>

<script>
function checkPassword() {

    const password =
        document.getElementById("password").value;

    if (password === "666") {

        document.getElementById("login").style.display = "none";

        document.getElementById("success").style.display = "block";

    } else {

        document.getElementById("error").style.display = "block";

    }
}

// الدخول باستخدام زر Enter
document.getElementById("password")
.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        checkPassword();
    }
});
</script>

</body>
</html>
