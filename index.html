<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رمز الاعتذار - الفلاح</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* خلفية سحابات أكاتسوكي المتحركة */
    .akatsuki-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      width: 140px;
      height: 70px;
      background-color: #8b0000;
      border: 3px solid #ffffff;
      border-radius: 50px;
      opacity: 0.85;
      box-shadow: 0 0 20px rgba(139, 0, 0, 0.7);
      animation: floatClouds 16s linear infinite;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background-color: #8b0000;
      border-radius: 50%;
    }

    .cloud::before {
      width: 65px;
      height: 65px;
      top: -30px;
      left: 20px;
      border-top: 3px solid #ffffff;
      border-left: 3px solid #ffffff;
    }

    .cloud::after {
      width: 45px;
      height: 45px;
      top: -20px;
      right: 25px;
      border-top: 3px solid #ffffff;
      border-right: 3px solid #ffffff;
    }

    .cloud:nth-child(1) { top: 15%; left: -180px; animation-duration: 20s; transform: scale(0.9); }
    .cloud:nth-child(2) { top: 50%; left: -180px; animation-duration: 14s; animation-delay: 3s; transform: scale(1.1); }
    .cloud:nth-child(3) { top: 80%; left: -180px; animation-duration: 22s; animation-delay: 1s; transform: scale(0.8); }

    @keyframes floatClouds {
      0% { left: -180px; }
      100% { left: 105vw; }
    }

    /* صندوق الواجهة الرئيسية */
    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 420px;
      background: rgba(15, 15, 15, 0.92);
      border: 2px solid rgba(139, 0, 0, 0.6);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    /* سحابة أكاتسوكي الحقيقية بالأعلى */
    .top-cloud-img {
      width: 110px;
      height: auto;
      margin: 0 auto 12px auto;
      display: block;
      filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.6));
    }

    .brand-title {
      font-size: 2rem;
      font-weight: bold;
      color: #ff4d4d;
      margin-bottom: 5px;
      text-shadow: 0 0 12px rgba(255, 77, 77, 0.5);
    }

    .sub-heading {
      font-size: 1.1rem;
      color: #dddddd;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    .pin-input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
      font-size: 1.4rem;
      text-align: center;
      letter-spacing: 8px;
      outline: none;
      margin-bottom: 15px;
    }

    .pin-input:focus {
      border-color: #ff4d4d;
      box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #8b0000;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #b30000;
    }

    .error-msg {
      color: #ff4d4d;
      margin-top: 12px;
      font-size: 0.9rem;
      display: none;
    }

    /* الصفحة الثانية (تظهر بعد إدخال الرمز الصحيح 666) */
    .main-content {
      display: none;
      text-align: right;
    }

    .letter-box {
      background: rgba(25, 25, 25, 0.85);
      border: 1px solid #444;
      border-radius: 12px;
      padding: 20px;
      margin-top: 15px;
      line-height: 1.8;
      color: #f1f1f1;
      border-right: 4px solid #8b0000;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <!-- الخلفية -->
  <div class="akatsuki-bg">
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
  </div>

  <div class="container">
    
    <!-- الصفحة الأولى (القفل) -->
    <div id="lockScreen">
      <!-- السحابة الحمراء الأصلية بالأعلى -->
      <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=200&auto=format&fit=crop" alt="Akatsuki Cloud" class="top-cloud-img" onerror="this.src='https://i.imgur.com/7gXpB5T.png'">
      
      <div class="brand-title">الفلاح</div>
      <div class="sub-heading">رمز الاعتذار</div>
      
      <input type="password" id="pinInput" class="pin-input" placeholder="***" maxlength="3">
      <button class="btn" onclick="checkPin()">فتح الرسالة</button>
      <div id="errorMsg" class="error-msg">الرمز غير صحيح، حاول مرة أخرى!</div>
    </div>

    <!-- الصفحة الثانية (محتوى الرسالة) -->
    <div id="mainContent" class="main-content">
      <h3 style="color: #ff4d4d; margin-bottom: 5px; text-align: center;">رسالة خاصة</h3>
      <hr style="border: 0; border-top: 1px solid #444; margin-bottom: 15px;">
      
      <div class="letter-box">
        السلام عليكم،<br>
        أكتب لك هذه الرسالة لأعبر لك عن مدى تقديري واعتذاري...
      </div>
    </div>

  </div>

  <script>
    function checkPin() {
      const pin = document.getElementById('pinInput').value;
      const errorMsg = document.getElementById('errorMsg');
      
      if (pin === '666') {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
      } else {
        errorMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
